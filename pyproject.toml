[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unicamo-noise-implementation"
version = "0.1.0"
description = "Independent, paper-audited UniCaMo noise construction without Wan"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "Pillow>=9"]

[tool.setuptools.packages.find]
include = ["unicamo_noise*"]
